<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ludo Board</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* ================= BOARD ================= */

.board {
    width: 600px;
    height: 600px;

    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(15, 1fr);

    background: white;
    border: 5px solid white;
    box-shadow: 0 0 15px #000;
}


/* ================= CELLS ================= */

.cell {
    border: 1px solid #777;
    background: white;
    position: relative;
}


/* ================= HOMES ================= */

.home {
    position: relative;
    padding: 28px;
    z-index: 5;

    display: flex;
    justify-content: center;
    align-items: center;
}

.red-home {
    grid-column: 1 / 7;
    grid-row: 1 / 7;
    background: #e53935;
}

.green-home {
    grid-column: 10 / 16;
    grid-row: 1 / 7;
    background: #43a047;
}

.yellow-home {
    grid-column: 1 / 7;
    grid-row: 10 / 16;
    background: #fdd835;
}

.blue-home {
    grid-column: 10 / 16;
    grid-row: 10 / 16;
    background: #1e88e5;
}


/* ================= INNER HOME ================= */

.home-inner {
    width: 100%;
    height: 100%;

    background: white;
    border-radius: 10px;

    padding: 18px;

    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;

    gap: 18px;
}


/* ================= TOKENS ================= */

.token {
    border-radius: 50%;
    border: 4px solid #777;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}


/* token small inner circle */

.token::after {
    content: "";
    width: 45%;
    height: 45%;
    border-radius: 50%;
    border: 3px solid white;
}


/* TOKEN COLORS */

.red-token {
    background: #e53935;
}

.green-token {
    background: #43a047;
}

.yellow-token {
    background: #fdd835;
}

.blue-token {
    background: #1e88e5;
}


/* ================= PATH ================= */

.path {
    background: white;
    z-index: 2;
}


/* ================= FINAL PATHS ================= */

/* TOP - YELLOW */

.yellow-path {
    background: #fdd835;
}


/* LEFT - GREEN */

.green-path {
    background: #43a047;
}


/* BOTTOM - RED */

.red-path {
    background: #e53935;
}


/* RIGHT - BLUE */

.blue-path {
    background: #1e88e5;
}


/* ================= START CELLS ================= */

.start {
    position: relative;
}

.start::after {
    content: "★";

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 18px;
    color: white;
}


/* ================= SAFE CELLS ================= */

.safe::after {
    content: "★";

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 18px;
    color: #777;
}


/* ================= CENTER ================= */

.center {
    grid-column: 7 / 10;
    grid-row: 7 / 10;

    position: relative;

    overflow: hidden;

    background:
        conic-gradient(
            #43a047 0deg 90deg,
            #1e88e5 90deg 180deg,
            #e53935 180deg 270deg,
            #fdd835 270deg 360deg
        );

    border: 2px solid #333;

    z-index: 10;
}


/* center creates proper 4 triangles */

.center::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            45deg,
            transparent 49%,
            white 50%,
            transparent 51%
        );
}


/* ================= ARROWS ================= */

.arrow {
    position: absolute;

    font-size: 20px;
    font-weight: bold;

    z-index: 20;
}

.arrow-top {
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    color: #fdd835;
}

.arrow-left {
    left: 2px;
    top: 50%;
    transform: translateY(-50%);
    color: #43a047;
}

.arrow-right {
    right: 2px;
    top: 50%;
    transform: translateY(-50%);
    color: #1e88e5;
}

.arrow-bottom {
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    color: #e53935;
}


/* ================= RESPONSIVE ================= */

@media(max-width:650px) {

    .board {
        width: 95vw;
        height: 95vw;
    }

    .home {
        padding: 15px;
    }

    .home-inner {
        padding: 10px;
        gap: 10px;
    }

}

</style>
</head>


<body>


<div class="board" id="board">


    <!-- ================= RED HOME ================= -->

    <div class="home red-home">

        <div class="home-inner">

            <div class="token red-token"></div>
            <div class="token red-token"></div>
            <div class="token red-token"></div>
            <div class="token red-token"></div>

        </div>

    </div>



    <!-- ================= GREEN HOME ================= -->

    <div class="home green-home">

        <div class="home-inner">

            <div class="token green-token"></div>
            <div class="token green-token"></div>
            <div class="token green-token"></div>
            <div class="token green-token"></div>

        </div>

    </div>



    <!-- ================= YELLOW HOME ================= -->

    <div class="home yellow-home">

        <div class="home-inner">

            <div class="token yellow-token"></div>
            <div class="token yellow-token"></div>
            <div class="token yellow-token"></div>
            <div class="token yellow-token"></div>

        </div>

    </div>



    <!-- ================= BLUE HOME ================= -->

    <div class="home blue-home">

        <div class="home-inner">

            <div class="token blue-token"></div>
            <div class="token blue-token"></div>
            <div class="token blue-token"></div>
            <div class="token blue-token"></div>

        </div>

    </div>



    <!-- ================= CENTER ================= -->

    <div class="center">

        <div class="arrow arrow-top">▼</div>

        <div class="arrow arrow-left">▶</div>

        <div class="arrow arrow-right">◀</div>

        <div class="arrow arrow-bottom">▲</div>

    </div>


</div>



<script>

/* ==================================================
   CREATE COMPLETE 15 × 15 LUDO BOARD
   ================================================== */

const board = document.getElementById("board");


/* HOME AREAS */

const isHome = (r, c) => {

    return (
        (r <= 5 && c <= 5) ||
        (r <= 5 && c >= 9) ||
        (r >= 9 && c <= 5) ||
        (r >= 9 && c >= 9)
    );

};


/* CREATE CELLS */

for (let r = 0; r < 15; r++) {

    for (let c = 0; c < 15; c++) {


        /* Don't create cells inside homes */

        if (isHome(r, c))
            continue;


        /* Don't create center */

        if (
            r >= 6 &&
            r <= 8 &&
            c >= 6 &&
            c <= 8
        )
            continue;


        const cell = document.createElement("div");

        cell.classList.add("cell");


        /* =========================
           PATH
           ========================= */

        let isPath = false;


        /*
          Horizontal paths:
          rows 6,7,8
        */

        if (
            r >= 6 &&
            r <= 8 &&
            c >= 0 &&
            c <= 14
        ) {
            isPath = true;
        }


        /*
          Vertical paths:
          columns 6,7,8
        */

        if (
            c >= 6 &&
            c <= 8 &&
            r >= 0 &&
            r <= 14
        ) {
            isPath = true;
        }


        if (isPath) {

            cell.classList.add("path");


            /* =====================
               TOP FINAL LANE
               ===================== */

            if (
                c === 7 &&
                r >= 1 &&
                r <= 5
            ) {

                cell.classList.add("yellow-path");

            }


            /* =====================
               LEFT FINAL LANE
               ===================== */

            if (
                r === 7 &&
                c >= 1 &&
                c <= 5
            ) {

                cell.classList.add("green-path");

            }


            /* =====================
               BOTTOM FINAL LANE
               ===================== */

            if (
                c === 7 &&
                r >= 9 &&
                r <= 13
            ) {

                cell.classList.add("red-path");

            }


            /* =====================
               RIGHT FINAL LANE
               ===================== */

            if (
                r === 7 &&
                c >= 9 &&
                c <= 13
            ) {

                cell.classList.add("blue-path");

            }


            /* =====================
               START CELLS
               ===================== */

            if (r === 6 && c === 1) {

                cell.classList.add("start");

            }

            if (r === 1 && c === 8) {

                cell.classList.add("start");

            }

            if (r === 8 && c === 13) {

                cell.classList.add("start");

            }

            if (r === 13 && c === 6) {

                cell.classList.add("start");

            }


            /* =====================
               SAFE CELLS
               ===================== */

            const safeCells = [

                [2, 6],
                [6, 2],
                [6, 12],
                [8, 12],
                [12, 8],
                [12, 6],
                [8, 2],
                [2, 8]

            ];


            safeCells.forEach(pos => {

                if (
                    r === pos[0] &&
                    c === pos[1]
                ) {

                    cell.classList.add("safe");

                }

            });

        }


        /*
           Position cell in 15 × 15 grid
        */

        cell.style.gridRow = r + 1;

        cell.style.gridColumn = c + 1;


        board.appendChild(cell);

    }

}

</script>

</body>
</html>
