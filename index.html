<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Board</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #29284b;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.game {
    text-align: center;
}

/* ================= BOARD ================= */

.board {
    width: 560px;
    height: 560px;
    background: white;
    border: 7px solid #ff8a35;
    border-radius: 8px;
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(15, 1fr);
    overflow: hidden;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
}

/* ================= HOME AREAS ================= */

.home {
    position: relative;
    border: 1px solid #777;
    display: flex;
    justify-content: center;
    align-items: center;
}

.red {
    background: #f52938;
    grid-column: 1 / 7;
    grid-row: 1 / 7;
}

.green {
    background: #16a568;
    grid-column: 10 / 16;
    grid-row: 1 / 7;
}

.blue {
    background: #159bd5;
    grid-column: 1 / 7;
    grid-row: 10 / 16;
}

.yellow {
    background: #ffd51c;
    grid-column: 10 / 16;
    grid-row: 10 / 16;
}

/* Inner white square */

.home-inner {
    width: 70%;
    height: 70%;
    background: white;
    border-radius: 5px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    padding: 13%;
    gap: 15%;
}

/* Tokens */

.token {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.15);
}

.red .token {
    background: #ed2633;
}

.green .token {
    background: #159b62;
}

.blue .token {
    background: #1494ce;
}

.yellow .token {
    background: #f7c900;
}

/* ================= PATH ================= */

.cell {
    border: 1px solid #777;
    background: white;
}

/* Green path */
.green-path {
    background: #15a667;
}

/* Red path */
.red-path {
    background: #f52d3a;
}

/* Blue path */
.blue-path {
    background: #159bd5;
}

/* Yellow path */
.yellow-path {
    background: #ffd51c;
}

/* ================= CENTER ================= */

.center {
    grid-column: 7 / 10;
    grid-row: 7 / 10;
    position: relative;
    overflow: hidden;
    border: 1px solid #777;
    background: white;
}

/* Four triangles */

.triangle-red {
    position: absolute;
    width: 0;
    height: 0;
    border-top: 45px solid transparent;
    border-bottom: 45px solid transparent;
    border-right: 78px solid #f32b39;
    left: 0;
    top: 5px;
}

.triangle-green {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 45px solid transparent;
    border-right: 45px solid transparent;
    border-bottom: 78px solid #16a667;
    top: 0;
    left: 5px;
}

.triangle-yellow {
    position: absolute;
    width: 0;
    height: 0;
    border-top: 45px solid transparent;
    border-bottom: 45px solid transparent;
    border-left: 78px solid #ffd51c;
    right: 0;
    top: 5px;
}

.triangle-blue {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 45px solid transparent;
    border-right: 45px solid transparent;
    border-top: 78px solid #159bd5;
    bottom: 0;
    left: 5px;
}

/* ================= SPECIAL STARS ================= */

.star {
    font-size: 13px;
    text-align: center;
    line-height: 1;
}

/* ================= DICE / PLAYER ICONS ================= */

.players {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 12px;
}

.player {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    font-weight: bold;
}

.p-red {
    background: #f32b39;
}

.p-green {
    background: #16a667;
}

.p-yellow {
    background: #ffd51c;
}

.p-blue {
    background: #159bd5;
}
</style>
</head>

<body>

<div class="game">

    <div class="board">

        <!-- RED HOME -->
        <div class="home red">
            <div class="home-inner">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>

        <!-- GREEN HOME -->
        <div class="home green">
            <div class="home-inner">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>

        <!-- BLUE HOME -->
        <div class="home blue">
            <div class="home-inner">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>

        <!-- YELLOW HOME -->
        <div class="home yellow">
            <div class="home-inner">
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
                <div class="token"></div>
            </div>
        </div>


        <!-- ================= TRACK ================= -->

        <!-- TOP TRACK -->

        <div class="cell" style="grid-column:7;grid-row:1"></div>
        <div class="cell" style="grid-column:8;grid-row:1"></div>
        <div class="cell" style="grid-column:9;grid-row:1"></div>

        <div class="cell green-path" style="grid-column:7;grid-row:2"></div>
        <div class="cell" style="grid-column:8;grid-row:2">★</div>
        <div class="cell green-path" style="grid-column:9;grid-row:2"></div>

        <div class="cell green-path" style="grid-column:7;grid-row:3"></div>
        <div class="cell green-path" style="grid-column:8;grid-row:3"></div>
        <div class="cell green-path" style="grid-column:9;grid-row:3"></div>

        <div class="cell green-path" style="grid-column:7;grid-row:4"></div>
        <div class="cell green-path" style="grid-column:8;grid-row:4"></div>
        <div class="cell green-path" style="grid-column:9;grid-row:4"></div>

        <div class="cell green-path" style="grid-column:7;grid-row:5"></div>
        <div class="cell green-path" style="grid-column:8;grid-row:5"></div>
        <div class="cell green-path" style="grid-column:9;grid-row:5"></div>

        <div class="cell" style="grid-column:7;grid-row:6"></div>
        <div class="cell" style="grid-column:8;grid-row:6"></div>
        <div class="cell" style="grid-column:9;grid-row:6"></div>


        <!-- LEFT TRACK -->

        <div class="cell" style="grid-column:1;grid-row:7"></div>
        <div class="cell red-path" style="grid-column:2;grid-row:7"></div>
        <div class="cell" style="grid-column:3;grid-row:7">★</div>
        <div class="cell red-path" style="grid-column:4;grid-row:7"></div>
        <div class="cell red-path" style="grid-column:5;grid-row:7"></div>
        <div class="cell red-path" style="grid-column:6;grid-row:7"></div>

        <div class="cell" style="grid-column:1;grid-row:8"></div>
        <div class="cell red-path" style="grid-column:2;grid-row:8"></div>
        <div class="cell red-path" style="grid-column:3;grid-row:8"></div>
        <div class="cell red-path" style="grid-column:4;grid-row:8"></div>
        <div class="cell red-path" style="grid-column:5;grid-row:8"></div>
        <div class="cell red-path" style="grid-column:6;grid-row:8"></div>

        <div class="cell" style="grid-column:1;grid-row:9"></div>
        <div class="cell" style="grid-column:2;grid-row:9"></div>
        <div class="cell" style="grid-column:3;grid-row:9"></div>
        <div class="cell" style="grid-column:4;grid-row:9"></div>
        <div class="cell" style="grid-column:5;grid-row:9"></div>
        <div class="cell" style="grid-column:6;grid-row:9"></div>


        <!-- RIGHT TRACK -->

        <div class="cell" style="grid-column:10;grid-row:7"></div>
        <div class="cell yellow-path" style="grid-column:11;grid-row:7"></div>
        <div class="cell yellow-path" style="grid-column:12;grid-row:7"></div>
        <div class="cell" style="grid-column:13;grid-row:7">★</div>
        <div class="cell yellow-path" style="grid-column:14;grid-row:7"></div>
        <div class="cell" style="grid-column:15;grid-row:7"></div>

        <div class="cell" style="grid-column:10;grid-row:8"></div>
        <div class="cell yellow-path" style="grid-column:11;grid-row:8"></div>
        <div class="cell yellow-path" style="grid-column:12;grid-row:8"></div>
        <div class="cell yellow-path" style="grid-column:13;grid-row:8"></div>
        <div class="cell yellow-path" style="grid-column:14;grid-row:8"></div>
        <div class="cell" style="grid-column:15;grid-row:8"></div>

        <div class="cell" style="grid-column:10;grid-row:9"></div>
        <div class="cell yellow-path" style="grid-column:11;grid-row:9"></div>
        <div class="cell yellow-path" style="grid-column:12;grid-row:9"></div>
        <div class="cell yellow-path" style="grid-column:13;grid-row:9"></div>
        <div class="cell yellow-path" style="grid-column:14;grid-row:9"></div>
        <div class="cell" style="grid-column:15;grid-row:9"></div>


        <!-- BOTTOM TRACK -->

        <div class="cell" style="grid-column:7;grid-row:10"></div>
        <div class="cell blue-path" style="grid-column:8;grid-row:10"></div>
        <div class="cell" style="grid-column:9;grid-row:10"></div>

        <div class="cell blue-path" style="grid-column:7;grid-row:11"></div>
        <div class="cell blue-path" style="grid-column:8;grid-row:11"></div>
        <div class="cell blue-path" style="grid-column:9;grid-row:11"></div>

        <div class="cell blue-path" style="grid-column:7;grid-row:12"></div>
        <div class="cell blue-path" style="grid-column:8;grid-row:12"></div>
        <div class="cell blue-path" style="grid-column:9;grid-row:12"></div>

        <div class="cell blue-path" style="grid-column:7;grid-row:13"></div>
        <div class="cell blue-path" style="grid-column:8;grid-row:13"></div>
        <div class="cell blue-path" style="grid-column:9;grid-row:13"></div>

        <div class="cell" style="grid-column:7;grid-row:14"></div>
        <div class="cell" style="grid-column:8;grid-row:14">★</div>
        <div class="cell" style="grid-column:9;grid-row:14"></div>

        <div class="cell" style="grid-column:7;grid-row:15"></div>
        <div class="cell" style="grid-column:8;grid-row:15"></div>
        <div class="cell" style="grid-column:9;grid-row:15"></div>


        <!-- CENTER -->
        <div class="center">
            <div class="triangle-red"></div>
            <div class="triangle-green"></div>
            <div class="triangle-yellow"></div>
            <div class="triangle-blue"></div>
        </div>

    </div>


    <!-- PLAYER COLORS -->

    <div class="players">
        <div class="player p-green">●</div>
        <div class="player p-red">●</div>
        <div class="player p-yellow">●</div>
        <div class="player p-blue">●</div>
    </div>

</div>

</body>
</html>
